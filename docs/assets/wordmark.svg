<svg xmlns="http://www.w3.org/2000/svg" width="949" height="143" viewBox="0 0 949 143" role="img" aria-label="agentistics">
  <title>agentistics</title>
  <desc>The agentistics wordmark, drawn in block characters with a red-to-yellow horizontal ramp.</desc>
  <defs>
    <!-- The art's palette is a horizontal ramp (a glyph's colour depends only on its column), so
         one gradient across the full width reproduces it exactly and stays smooth at any size. -->
    <linearGradient id="agentisticsRamp" x1="0" y1="0" x2="949" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cd3131" />
      <stop offset="1" stop-color="#e5e510" />
    </linearGradient>
  </defs>
  <!-- font-size intentionally exceeds the 15px line height: the block glyphs must meet
       vertically, and matching the two leaves a visible seam between rows. textLength pins each
       row to an exact width so the art cannot drift when a different monospace font substitutes. -->
  <g font-family="SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="url(#agentisticsRamp)">
    <text x="0" y="15.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">      ░████                                                ░████                      ░████</text>
    <text x="0" y="30.0" textLength="764.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ░██████                                                ░████                      ░████</text>
    <text x="0" y="45.0" textLength="932.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ░██████      ░██████      ░████░████   ░████░██████████       ░██████  ░██████████       ░██████    ░██████</text>
    <text x="0" y="60.0" textLength="949.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">    ░██ ░██    ░████████  ░████████░██████ ░████░██████████░████░████ ░████░██████████░████░████ ░████░████ ░████</text>
    <text x="0" y="75.0" textLength="898.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ░████ ░████  ░████      ░████    ░██████ ░████  ░████    ░████░████        ░████    ░████░████      ░████</text>
    <text x="0" y="90.0" textLength="932.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  ░██████████  ░████ ░████░██████  ░████████████  ░████    ░████  ░██████    ░████    ░████░████        ░██████</text>
    <text x="0" y="105.0" textLength="949.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">░████████████  ░████ ░████░████    ░████ ░██████  ░████    ░████      ░████  ░████    ░████░████            ░████</text>
    <text x="0" y="120.0" textLength="949.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">░████     ░████░██████████░████████░████   ░████  ░████    ░████  ░████████  ░████    ░████░████ ░████  ░████████</text>
    <text x="0" y="135.0" textLength="932.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">░████     ░████  ░██████  ░████████░████     ░██  ░██        ░██  ░██████    ░██        ░██  ░██████    ░██████</text>
  </g>
</svg>
