# INGEST-ONLY overlay — the public half of a split deployment.
#
# A cloud GitHub Actions runner has to reach the central to push its metrics, and nothing else
# about the central should be reachable from the internet to make that possible. This overlay
# turns an instance into one that serves ONLY `POST /api/team/ingest` (plus its OPTIONS
# preflight) and answers 404 for everything else — the dashboard, the login page, /api/data,
# the static assets, all of it. There is nothing to read, only a token-gated write endpoint.
#
# Run it as a SECOND stack beside your private dashboard instance, sharing one MongoDB:
#
#   docker compose -p team-ingest \
#     -f docker/central.image.yml -f docker/central.ingest-only.yml \
#     --env-file central.ingest.env up -d
#
# Its central.ingest.env must:
#   • point MONGO_URL at the SAME database as the dashboard instance (an external URI, or the
#     dashboard stack's Mongo reachable over a shared docker network — do NOT add
#     central.localdb.yml here, or this stack gets a second, empty database);
#   • use a DIFFERENT APP_PORT, since both stacks run on one host;
#   • set AGENTISTICS_EXPOSURE=public, AGENTISTICS_TEAM_TLS=1 and AGENTISTICS_TRUST_PROXY=1 —
#     it is the instance that faces the internet;
#   • carry the ingest credential: AGENTISTICS_TEAM_INGEST_TOKEN, or AGENTISTICS_OIDC_AUDIENCE
#     for keyless GitHub OIDC (preferred — no stored secret).
#
# `-p team-ingest` is deliberate: the base files pin `name: team-mode`, and reusing that name
# would recreate your dashboard's containers instead of starting a second stack. The project
# flag overrides the pinned name.
#
# See docs/github-actions.md for the runner side and docs/exposure.md for the edge.

services:
  app:
    environment:
      AGENTISTICS_INGEST_ONLY: "1"
