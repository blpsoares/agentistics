# Self-contribution overlay. Merged ONLY when AGENTISTICS_CENTRAL_USER is set in central.env
# (central.sh does this automatically), so a dedicated central has NO access to the host
# filesystem at all — which matters because an exposed central holding read-only mounts of
# ~/.claude is holding every raw transcript on the machine.
#
# With this overlay the central also reads the host's own harness dirs and attributes that
# usage to AGENTISTICS_CENTRAL_USER. Mounts are read-only; the app never writes to them.
#
# Run directly with:
#   docker compose -f docker/central.yml -f docker/central.localdb.yml \
#     -f docker/central.selfcontrib.yml --env-file central.env up -d
services:
  app:
    volumes:
      - ${HOME}/.claude:/host-claude:ro
      - ${HOME}/.codex:/host-codex:ro
      - ${HOME}/.gemini:/host-gemini:ro
      - ${HOME}/.copilot:/host-copilot:ro
