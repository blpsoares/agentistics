# The team CENTRAL — built from this checkout.
#
#   ./central.sh up                     # the wrapper: picks the overlays and passes -p/--env-file
#   agentop central up --build          # the same thing from the CLI
#
# Raw compose, if you want to drive it yourself (the wrapper adds --env-file and the overlays):
#   docker compose -f docker/central.yml -f docker/central.localdb.yml \
#     --env-file central.env up -d --build --force-recreate
#
# To run the PUBLISHED image instead of building, use docker/central.image.yml — same service,
# same volumes, same project name, so the two are interchangeable on one host.
#
# See docs/central-deploy.md (how to run one) and docs/exposure.md (how to publish one).

# Pinned so a raw `docker compose -f docker/central.yml …` lands on the SAME project as
# `central.sh` (which passes -p team-mode). Without it the project name comes from the compose
# file's directory — `docker` — and you get a second, silent stack beside the real one.
name: team-mode

services:
  app:
    # The build context is the REPO ROOT, not this directory: the Dockerfile copies package.json,
    # bun.lock and packages/ from there.
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # Defaults to the bundled local Mongo (added by docker/central.localdb.yml). Set MONGO_URL
      # in central.env to an external cluster (e.g. mongodb+srv://…@atlas/) and central.sh will
      # NOT start the local Mongo — the app connects straight to the external one.
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-agentistics}
      AGENTISTICS_TEAM_CENTRAL: "1"
      AGENTISTICS_TEAM_ORG: ${AGENTISTICS_TEAM_ORG:-default}
      AGENTISTICS_TEAM_PASSWORD: ${AGENTISTICS_TEAM_PASSWORD:-}
      AGENTISTICS_TEAM_SESSION_SECRET: ${AGENTISTICS_TEAM_SESSION_SECRET:-}
      AGENTISTICS_TEAM_INGEST_TOKEN: ${AGENTISTICS_TEAM_INGEST_TOKEN:-}

      # --- Exposure ----------------------------------------------------------------------
      # Every variable below decides what this instance is ALLOWED to do, so each one must be
      # reachable from central.env — a documented setting the compose does not pass through is
      # a setting that silently does nothing. See docs/exposure.md.
      #
      # How reachable this instance is: local | lan | public (see server/exposure.ts).
      # `public` permanently revokes the local-shell, local-chat, host-transcript and MCP-admin
      # routes. Unset defaults to `lan` on a central; an unknown value fails closed to `public`.
      AGENTISTICS_EXPOSURE: ${AGENTISTICS_EXPOSURE:-}
      # Re-enables those host-power routes on a `lan` central. IGNORED on `public` — there is no
      # opt-in for arbitrary shell on an instance strangers can reach.
      AGENTISTICS_ALLOW_LOCAL_SHELL: ${AGENTISTICS_ALLOW_LOCAL_SHELL:-}
      # Set to 1 only when a proxy that rewrites CF-Connecting-IP / X-Forwarded-For is the ONLY
      # way in (cloudflared on the same host + BIND_IP=127.0.0.1). Otherwise a client picks its
      # own rate-limit bucket by sending the header.
      AGENTISTICS_TRUST_PROXY: ${AGENTISTICS_TRUST_PROXY:-}
      # 1 when TLS is terminated in front of this container: adds Secure + the __Host- cookie
      # prefix and emits HSTS.
      AGENTISTICS_TEAM_TLS: ${AGENTISTICS_TEAM_TLS:-}
      # Comma-separated browser origins allowed cross-origin. Normally EMPTY — the dashboard is
      # served by this same process, so it is same-origin. Only for a split deployment.
      AGENTISTICS_ALLOWED_ORIGINS: ${AGENTISTICS_ALLOWED_ORIGINS:-}
      # 1 serves ONLY POST /api/team/ingest and 404s everything else — the public half of a
      # split deployment for cloud CI runners. See docker/central.ingest-only.yml.
      AGENTISTICS_INGEST_ONLY: ${AGENTISTICS_INGEST_ONLY:-}
      # Keyless GitHub Actions ingest: set the audience the workflow requests to enable OIDC.
      # The issuer defaults to GitHub and only needs setting for a non-GitHub OIDC provider.
      AGENTISTICS_OIDC_AUDIENCE: ${AGENTISTICS_OIDC_AUDIENCE:-}
      AGENTISTICS_OIDC_ISSUER: ${AGENTISTICS_OIDC_ISSUER:-}

      # Self-contribution: set this to the central machine's own identity to also show
      # this machine's Claude usage in the dashboard (one instance = central + member).
      # Requires docker/central.selfcontrib.yml, which central.sh includes automatically when
      # this is set — a dedicated central mounts nothing from the host at all.
      AGENTISTICS_CENTRAL_USER: ${AGENTISTICS_CENTRAL_USER:-}
      PORT: "47291"
      SERVE_STATIC: "1"
    volumes:
      # The app's writable data dir (preferences, consolidate store, sync state). A named
      # volume so it survives container recreation (down/up, image upgrade) — otherwise the
      # archive-mode consent gate + install prompt reappear on every recreate.
      #
      # /data/.agentistics, not /root/.agentistics: the image runs as uid 10001 with HOME=/data
      # (see Dockerfile). A volume mounted anywhere else is a volume the app never writes to.
      - agentistics_data:/data/.agentistics
    ports:
      # Bind interface. Default 127.0.0.1 = reachable only from this host, which is all a
      # tunnel or a local reverse proxy needs. Set BIND_IP=0.0.0.0 deliberately for LAN access —
      # a fresh install should never land on the network by accident.
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-48080}:47291"
    # NOTE — deliberately NO `pid: host` here, unlike docker/machine.yml. A central does
    # not detect live sessions by reading /proc: it has no visibility into a member's machine at
    # all, so members report their own snapshots over the reverse-channel WebSocket
    # (team-agent-client.ts → team-live.ts). Giving the central the host pid namespace would only
    # expose the aggregator box's own processes, which nobody is asking about, at the cost of the
    # hardening below. A central's "Open now" being empty is a MEMBER-side question — check that
    # the member's own panel works and that its sharing rules do not withhold the repository.
    #
    # Hardening: unprivileged user, immutable root filesystem, no capabilities, no privilege
    # escalation. The only writable paths are the data volume and a small tmpfs.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:47291/api/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  agentistics_data:
