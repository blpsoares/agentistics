# Optional local-Mongo overlay. Merged on top of docker/central.yml (build) or
# docker/central.image.yml (published image) ONLY when the central uses the bundled database
# (i.e. MONGO_URL is empty or points at the internal `mongo` service). central.sh includes this
# file automatically; when MONGO_URL is an external cluster (e.g. mongodb+srv://…@atlas/) it is
# omitted, so no local Mongo container is started and the app does not wait on one.
#
# Run directly with:
#   docker compose -f docker/central.yml -f docker/central.localdb.yml --env-file central.env up -d
services:
  mongo:
    image: mongo:7
    command: --replSet rs0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          }
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    # mongo does NOT publish 27017 to the host — only the app service on the compose network
    # reaches it, and the tunnel must never route a database port (see docs/exposure.md).
    #
    # SECURITY NOTE — why --auth is not enabled here. Enabling it on a replica set additionally
    # requires an internal-authentication keyFile, and MONGO_INITDB_ROOT_* only creates the user
    # on a FRESH data directory: switching it on would lock every existing central out of its
    # own database. Credentials are therefore an operator decision, not a silent upgrade.
    # `agentop doctor` reports an unauthenticated bundled Mongo as a warning, not a failure,
    # precisely because the port is unreachable from outside the compose network. For a
    # credentialed database, point MONGO_URL at an external cluster (Atlas et al.) — central.sh
    # then omits this overlay entirely.
    volumes:
      - mongo_data:/data/db

  app:
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
